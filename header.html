<!-- ⚡【高度相容性的 RWD 漢堡選單與原生滑動滾動 JS 控制腳本】 -->
<script>
    (function() {
        const toggleBtn = document.getElementById('menu-toggle-btn');
        const mobilePanel = document.getElementById('mobile-menu-panel');
        const menuIcon = document.getElementById('menu-icon');

        if (toggleBtn && mobilePanel) {
            let isOpen = false;

            function openMenu() {
                isOpen = true;
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
                
                // 1. 動態追加滑動高度與不透明度 (純 Slide 垂直切換)
                mobilePanel.style.overflowY = 'hidden';
                mobilePanel.classList.remove('max-h-0', 'opacity-0');
                mobilePanel.classList.add('max-h-[85vh]', 'opacity-100');
                
                // 2. 當展開過渡動畫一結束（300ms），立刻解鎖原生滾動，保證 100% 能夠順暢滑動
                setTimeout(function() {
                    if (isOpen) {
                        mobilePanel.classList.remove('overflow-hidden');
                        mobilePanel.classList.add('overflow-y-auto');
                        mobilePanel.style.overflowY = 'auto';
                    }
                }, 300);
            }

            function closeMenu() {
                isOpen = false;
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');

                // 收合時，第一時間關閉滾動條，避免收合時內容突兀跳動
                mobilePanel.classList.remove('overflow-y-auto');
                mobilePanel.classList.add('overflow-hidden');
                mobilePanel.style.overflowY = 'hidden';

                // 觸發純 Slide 向上收回動畫
                mobilePanel.classList.remove('max-h-[85vh]', 'opacity-100');
                mobilePanel.classList.add('max-h-0', 'opacity-0');
            }

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (!isOpen) {
                    openMenu();
                } else {
                    closeMenu();
                }
            });

            // 點擊網頁外部任何角落自動收合選單
            document.addEventListener('click', function() {
                if (isOpen) {
                    closeMenu();
                }
            });

            // 防止點選選單內部項目時被誤判為外部點擊
            mobilePanel.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
    })();
</script>
