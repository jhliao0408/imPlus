<!-- ⚡【自動同步選單腳本：從桌機版自動提取產生手機版，免去寫兩次】 -->
<script>
    (function () {
        const desktopNav = document.getElementById('desktop-nav-menu');
        const mobileContainer = document.getElementById('mobile-menu-container');
        if (!desktopNav || !mobileContainer) return;

        let html = '';
        desktopNav.querySelectorAll('.group').forEach((group, idx) => {
            const btn = group.querySelector('button');
            const dropdown = group.querySelector('.group-hover\\:block, [class*="group-hover:block"]');
            if (!btn || !dropdown) return;

            const icon = btn.querySelector('i:first-child');
            const title = btn.querySelector('span');
            const iconClass = icon ? icon.className.replace('text-slate-800', 'text-emerald-600') : 'fa-solid fa-folder text-emerald-600';
            const titleText = title ? title.textContent.trim() : '';

            html += `
                <div class="border-b border-slate-300/30 pb-3 last:border-b-0">
                    <div class="flex items-center gap-2 text-slate-800 font-bold text-base mb-2">
                        <i class="${iconClass}"></i>
                        <span>${titleText}</span>
                    </div>
                    <div class="pl-6 flex flex-col gap-2">
            `;

            Array.from(dropdown.children).forEach(child => {
                if (child.tagName === 'A') {
                    const href = child.getAttribute('href') || '#';
                    const target = child.getAttribute('target') ? `target="${child.getAttribute('target')}"` : '';
                    const i = child.querySelector('i');
                    const span = child.querySelector('span');
                    const iClass = i ? i.className : 'fa-solid fa-angle-right text-emerald-600';
                    const text = span ? span.textContent.trim() : child.textContent.trim();

                    html += `
                        <a ${target} href="${href}" class="flex items-center gap-2 text-sm text-slate-700 hover:text-emerald-600 font-semibold py-1.5 transition-colors">
                            <i class="${iClass}"></i>
                            <span>${text}</span>
                        </a>
                    `;
                } else if (child.tagName === 'SPAN') {
                    const i = child.querySelector('i');
                    const span = child.querySelector('span');
                    const iClass = i ? i.className : 'fa-solid fa-angle-right text-slate-400';
                    const text = span ? span.textContent.trim() : child.textContent.trim();

                    html += `
                        <span class="flex items-center gap-2 text-sm text-slate-500 font-semibold py-1.5 cursor-not-allowed">
                            <i class="${iClass}"></i>
                            <span>${text}</span>
                        </span>
                    `;
                }
            });

            html += `
                    </div>
                </div>
            `;
        });

        mobileContainer.innerHTML = html;
    })();
</script>

<!-- ⚡【RWD 漢堡選單「固定高度 + 自適應捲軸」控制腳本】（完全保留您的原腳本，一字未修） -->
<script>
    (function () {
        const toggleBtn = document.getElementById('menu-toggle-btn');
        const mobilePanel = document.getElementById('mobile-menu-panel');
        const menuIcon = document.getElementById('menu-icon');

        if (toggleBtn && mobilePanel) {
            let isOpen = false;

            function openMenu() {
                isOpen = true;
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');

                // 💡 核心優化：限制面板最大高度為固定值（例如 260px，可依喜好微調），當高於 260px 時就會在內部產生滑順捲軸
                mobilePanel.style.maxHeight = '200px';

            }

            function closeMenu() {
                isOpen = false;
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');

                // 純垂直向上滑動收合
                mobilePanel.style.maxHeight = '0px';
            }

            toggleBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!isOpen) {
                    openMenu();
                } else {
                    closeMenu();
                }
            });

            // 點擊網頁外部任何角落自動收合選單
            document.addEventListener('click', function () {
                if (isOpen) {
                    closeMenu();
                }
            });

            // 防止點選選單內部項目時被誤判為外部點擊
            mobilePanel.addEventListener('click', function (e) {
                e.stopPropagation();
            });
        }
    })();
</script>
