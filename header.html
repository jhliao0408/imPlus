<!-- 頂部獨立導航列 (Navbar) - 獨立於背景圖之上，使用純實色 #e8ebf0，與 Logo 完美融合 -->
<nav class="relative z-40 bg-[#e8ebf0] border-b border-slate-300/60 shadow-md no-print h-14 sm:h-16 md:h-20">
    <div class="max-w-7xl mx-auto h-full flex items-center justify-start gap-8">
        <!-- Logo 區塊：去除了所有 padding 與 margin，使圖片高度與 Navbar 保持 100% 滿版一致 (h-full) -->

        <img src="images/navLogo.jpg" alt="智慧行動生活+" class="h-full w-auto object-contain p-0 m-0 block">
     
        <!-- 導航選單 (靠左對齊，緊隨 Logo 旁，搭配 gap 舒適排版) -->
        <div class="flex items-center h-full">
            <!-- 主選項「課表查詢」與下拉選單 -->
            <div class="relative group py-2">
                <!-- 💡 優化點：因為 Navbar 底色改為淺色 #e8ebf0，文字和 Icon 改為深色 text-slate-800 以保持極佳的可讀性 -->
                <button class="flex items-center gap-2 text-slate-800 hover:text-emerald-600 font-extrabold text-base sm:text-lg md:text-xl transition-colors focus:outline-none">
                    <i class="fa-solid fa-calendar-days text-slate-800 transition-colors group-hover:text-emerald-600"></i>
                    <span>課表查詢</span>
                    <i class="fa-solid fa-chevron-down text-xs transition-transform group-hover:rotate-180"></i>
                </button>
                <!-- 下拉選單區塊 - 靠左對齊 -->
                <div class="absolute left-0 top-full hidden group-hover:block bg-white text-slate-800 rounded-xl shadow-xl border border-slate-100 py-2 w-48 z-50 transform origin-top transition-all duration-200">
                    <a href="month.html" class="flex items-center gap-2 px-4 py-2.5 hover:bg-slate-50 font-bold text-xs sm:text-sm md:text-base text-slate-700 hover:text-emerald-600 transition-colors">
                        <i class="fa-solid fa-rectangle-list text-emerald-600"></i>
                        <span>整月課表一覽</span>
                    </a>
                    <div class="border-t border-slate-100 my-1"></div>
                    <a href="course.html" class="flex items-center gap-2 px-4 py-2.5 hover:bg-slate-50 font-bold text-xs sm:text-sm md:text-base text-slate-700 hover:text-emerald-600 transition-colors">
                        <i class="fa-solid fa-calendar-day text-emerald-600"></i>
                        <span>詳細課表查詢</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- 頂部內容層 (Hero Banner) - 移至 Navbar 下方，內含隨機照片背景 + 深色半透明遮罩 -->
<div class="relative bg-slate-900 text-white shadow-xl  overflow-hidden no-print py-10 md:py-12">
    <!-- 背景圖片層 (明亮通透，透過 JS 自動隨機抽換 src) -->
    <div class="absolute inset-0 z-0">
        <img id="random-header-bg"
            src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=2000&q=80"
            alt="Header Background"
            class="w-full h-full object-cover object-center transition-opacity duration-500 opacity-0">
        <!-- 強化中性無色淡化遮罩 (提升至 45% 純黑半透明 + 2px 磨砂霧面，使照片更柔和、不干擾文字) -->
        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px] z-10"></div>
    </div>

    <!-- 橫幅文字內容 -->
    <div class="relative z-30 max-w-7xl mx-auto px-6">
        <div class="inline-flex items-center gap-2 bg-black/40 border border-white/20 text-white text-xs  font-semibold px-3.5 py-1.5 rounded-full uppercase tracking-wider mb-3 backdrop-blur-md shadow-md">
            <i class="fa-solid fa-graduation-cap text-white-400"></i>
            <span class="font-bold text-sm md:text-md lg:text-lg">
                勞動部勞發署高分署 自辦職前訓練課程
            </span>
        </div>
        <!-- 大標與副標加入文字陰影，確保在明亮背景下清晰好讀 -->
        <h1 class="text-xl sm:text-3xl md:text-4xl font-extrabold mt-1 tracking-tight text-white [text-shadow:0_2px_4px_rgba(0,0,0,0.85)] leading-snug">
            115年智慧行動商務系統開發班第2期
        </h1>
        <p class="text-white/95 text-lg sm:text-xl md:text-2xl mt-2.5 flex items-center gap-2 font-medium [text-shadow:0_1px_3px_rgba(0,0,0,0.85)]">
            <i class="fa-solid fa-clock text-white text-lg"></i>
            <span id="header-badge" class="text-lg font-bold px-2 py-1 rounded">載入中</span>
        </p>
    </div>
</div>
